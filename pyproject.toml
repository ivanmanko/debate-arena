[project]
name = "debate-arena"
version = "0.2.0"
description = "Rational Check: three rational LLM analysts dissect a text by the common-sense manifesto; a judge issues a structured verdict. Web UI + Telegram bot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ivan" }]
dependencies = [
    "anthropic>=1.13,<2",          # Anthropic provider, official SDK (ADR-001)
    "httpx>=0.28",                 # DeepSeek OpenAI-compatible endpoint (ADR-001)
    "fastapi>=0.115,<1",           # web API + static frontend (ADR-003)
    "uvicorn[standard]>=0.30",
    "aiogram>=3.13,<4",            # Telegram bot, thin second interface (ADR-004)
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[project.scripts]
rational-check = "debate_arena.main:run"
rational-check-bot = "debate_arena.interface.bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_arena"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["debate_arena", "evals", "tests"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is intentionally kept as long, readable literal lines.
"src/debate_arena/domain/prompts.py" = ["E501"]
"src/debate_arena/infrastructure/llm/mock.py" = ["E501"]
"evals/frame_bias/cases.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: требует живых сервисов или ключей провайдеров"]
