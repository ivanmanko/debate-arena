[project]
name = "debate-arena"
version = "0.1.0"
description = "Telegram bot: drop a topic, several LLM philosopher-personas debate in rounds, a judge-bot scores them and declares who was more convincing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ivan" }]
dependencies = [
    "aiogram>=3.13,<4",
    "crewai>=0.80,<0.90",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[project.scripts]
debate-arena = "debate_arena.bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_arena"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt/persona text is intentionally kept as long, readable literal lines.
"src/debate_arena/storage/seed.py" = ["E501"]
"src/debate_arena/debate/engine.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
