services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: debate
      POSTGRES_PASSWORD: debate
      POSTGRES_DB: debate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://debate:debate@postgres:5432/debate
    restart: unless-stopped

volumes:
  pgdata:
