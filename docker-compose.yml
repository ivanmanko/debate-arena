services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rational
      POSTGRES_PASSWORD: rational
      POSTGRES_DB: rational
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rational"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rational:rational@postgres:5432/rational
      WEB_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Optional Telegram bot: `docker compose --profile bot up -d`
  bot:
    build: .
    profiles: ["bot"]
    command: ["rational-check-bot"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rational:rational@postgres:5432/rational
    restart: unless-stopped

volumes:
  pgdata:
